<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minion Run — The Minions Project</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: "Inter", sans-serif; }
      canvas { display: block; }
      #hud { position: fixed; top: 16px; left: 16px; color: #fff; font-weight: 800; font-size: 1.1rem; text-shadow: 0 2px 6px #000; pointer-events: none; }
      #hud span { color: #f9d93d; }
      #back { position: fixed; top: 16px; right: 16px; background: #f9d93d; color: #123e9b; padding: 10px 16px; border-radius: 999px; font-weight: 800; text-decoration: none; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(11, 16, 32, 0.55); color: #fff; text-align: center; }
      #overlay.hidden { display: none; }
      #overlay h2 { font-size: 3rem; margin: 0 0 10px; color: #f9d93d; }
      #overlay p { margin: 0 0 18px; font-size: 1.1rem; }
      #overlay button { background: #f9d93d; color: #123e9b; border: none; padding: 14px 26px; border-radius: 999px; font-weight: 800; font-size: 1rem; cursor: pointer; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="hud">Distance: <span id="score">0</span> m &nbsp; Best: <span id="best">0</span> m</div>
    <a id="back" href="/">Back to site</a>
    <div id="overlay">
      <div>
        <h2 id="title">Minion Run</h2>
        <p id="text">Dodge drones and barriers through the future city.</p>
        <button id="start">Start Run</button>
      </div>
    </div>
    <script type="module" src="./run.js"></script>
  </body>
</html>
